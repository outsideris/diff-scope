<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- diff-scope 앱 아이콘 — B안 "청크" (docs/DESIGN.md 참조)
       밝은 그라파이트 바탕 + diff 의미색(+초록 / −빨강) 두 줄 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafc"/>
      <stop offset="1" stop-color="#e6e6ec"/>
    </linearGradient>
    <linearGradient id="add" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#1f883d"/>
    </linearGradient>
    <linearGradient id="del" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0656c"/>
      <stop offset="1" stop-color="#d1373f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="102" y="102" width="820" height="820" rx="184" fill="url(#bg)"/>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="rgba(0,0,0,0.07)" stroke-width="2"/>

  <!-- 컨텍스트 라인 -->
  <g fill="#c9cad3">
    <rect x="256" y="244" width="296" height="48" rx="24"/>
    <rect x="256" y="732" width="376" height="48" rx="24"/>
  </g>

  <!-- diff 청크 -->
  <g filter="url(#soft)">
    <rect x="256" y="344" width="512" height="144" rx="72" fill="url(#add)"/>
    <rect x="256" y="536" width="424" height="144" rx="72" fill="url(#del)"/>
  </g>
  <g stroke="#ffffff" stroke-width="34" stroke-linecap="round">
    <line x1="306" y1="416" x2="378" y2="416"/>
    <line x1="342" y1="380" x2="342" y2="452"/>
    <line x1="306" y1="608" x2="378" y2="608"/>
  </g>
</svg>
